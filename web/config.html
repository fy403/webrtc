<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC 配置</title>
    <link href="style.css" rel="stylesheet">
    <link href="config.css" rel="stylesheet">
</head>
<body>
    <div class="config-page">
        <div id="qualityToast" class="quality-toast"></div>
        <div class="config-header-with-sidebar">
            <!-- 左侧配置列表 -->
            <div class="config-sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title">配置列表</div>
                    <button class="btn-icon-small" onclick="showCreateConfigModal()" title="新建配置">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
                            <line x1="12" x2="12" y1="5" y2="19"></line>
                            <line x1="5" x2="19" y1="12" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <div class="config-list" id="configList"></div>
                <div class="sidebar-footer">
                    <button class="btn btn-add" style="padding: 8px;" onclick="showCreateConfigModal()">+ 新建配置</button>
                </div>
            </div>

            <!-- 右侧配置内容 -->
            <div class="config-main">
                <div class="config-main-header">
                    <div class="config-name-display" id="currentConfigName">--</div>
                    <div class="config-actions">
                        <button class="btn btn-secondary" onclick="showRenameConfigModal()">重命名</button>
                        <button class="btn btn-secondary" onclick="copyCurrentConfig()">复制</button>
                        <button class="btn btn-secondary" onclick="deleteCurrentConfig()">删除</button>
                        <button class="btn btn-secondary" onclick="ConfigManager.resetCurrentConfig(); loadConfigToForm()">重置为默认</button>
                        <button class="btn btn-success" onclick="saveAndApply()">保存并应用</button>
                        <button class="btn btn-primary" onclick="applyOnly()">仅应用</button>
                        <button class="btn btn-danger" onclick="window.close()">关闭</button>
                    </div>
                </div>

                <div class="message" id="message"></div>

                <!-- 视频连接配置 -->
                <div class="config-section">
            <div class="section-title">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect height="16" rx="2" width="20" x="2" y="4" />
                    <polygon points="10 8 16 12 10 16 10 8" />
                </svg>
                视频连接配置
            </div>
            <div class="config-grid">
                <div class="form-group">
                    <label class="form-label">Signaling 服务器地址</label>
                    <input type="text" class="form-input" id="videoSignalingUrl" placeholder="ws://example.com:8000">
                </div>
                <div class="form-group">
                    <label class="form-label">远程设备 ID</label>
                    <input type="text" class="form-input" id="videoRemoteId" placeholder="cam_XXXXX">
                </div>
            </div>

            <div style="margin-top: 20px;">
                <label class="form-label">ICE 服务器配置</label>
                <div id="videoIceServers"></div>
                <button class="btn-add" onclick="addVideoIceServer()">+ 添加 ICE 服务器</button>
            </div>

            <div class="config-grid" style="margin-top: 20px;">
                <div class="form-group">
                    <label class="form-label">Bundle Policy</label>
                    <select class="form-select" id="videoBundlePolicy">
                        <option value="max-bundle">max-bundle</option>
                        <option value="balanced">balanced</option>
                        <option value="max-compat">max-compat</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">RTCP Mux Policy</label>
                    <select class="form-select" id="videoRtcpMuxPolicy">
                        <option value="require">require</option>
                        <option value="negotiate">negotiate</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Encoded Insertable Streams</label>
                    <select class="form-select" id="videoEncodedInsertableStreams">
                        <option value="false">禁用</option>
                        <option value="true">启用</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 视频参数配置 -->
        <div class="config-section">
            <div class="section-title">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect height="16" rx="2" width="20" x="2" y="4" />
                    <circle cx="12" cy="12" r="4" />
                </svg>
                视频参数配置
            </div>
            <div class="quality-preset-bar" id="qualityPresetBar">
                <button class="quality-preset-btn active" data-preset="medium" data-fps="30" data-bitrate="4000000" tabindex="0">中画质</button>
                <button class="quality-preset-btn" data-preset="low" data-fps="15" data-bitrate="1000000" tabindex="-1">低画质</button>
                <button class="quality-preset-btn" data-preset="high" data-fps="60" data-bitrate="8000000" tabindex="-1">高画质</button>
            </div>
            <div class="config-grid">
                <div class="form-group">
                    <label class="form-label">帧率 (FPS)</label>
                    <select class="form-select" id="videoFps">
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="60">60</option>
                        <option value="__custom__">自定义...</option>
                    </select>
                    <input type="number" class="form-input form-custom-input" id="videoFpsCustom"
                           placeholder="1-120" min="1" max="120" style="display:none; margin-top:6px;">
                </div>
                <div class="form-group">
                    <label class="form-label">码率 (bps)</label>
                    <select class="form-select" id="videoBitrate">
                        <option value="1000000">1 Mbps</option>
                        <option value="2000000">2 Mbps</option>
                        <option value="5000000">4 Mbps</option>
                        <option value="8000000">8 Mbps</option>
                        <option value="__custom__">自定义...</option>
                    </select>
                    <input type="number" class="form-input form-custom-input" id="videoBitrateCustom"
                           placeholder="Mbps" min="0.1" max="100" step="0.1" style="display:none; margin-top:6px;">
                </div>
            </div>
        </div>

        <!-- 数据连接配置 -->
        <div class="config-section">
            <div class="section-title">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M4 4h16v16H4z" />
                    <path d="M8 8h8v8H8z" />
                </svg>
                数据连接配置
            </div>
            <div class="config-grid">
                <div class="form-group">
                    <label class="form-label">Signaling 服务器地址</label>
                    <input type="text" class="form-input" id="dataSignalingUrl" placeholder="ws://example.com:8000">
                </div>
                <div class="form-group">
                    <label class="form-label">远程设备 ID</label>
                    <input type="text" class="form-input" id="dataRemoteId" placeholder="data_XXXXX">
                </div>
            </div>

            <div style="margin-top: 20px;">
                <label class="form-label">ICE 服务器配置</label>
                <div id="dataIceServers"></div>
                <button class="btn-add" onclick="addDataIceServer()">+ 添加 ICE 服务器</button>
            </div>
        </div>

        <!-- Shell 命令连接配置 -->
        <div class="config-section">
            <div class="section-title">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect x="2" y="3" width="20" height="18" rx="2" />
                    <polyline points="6 9 10 13 14 9" />
                    <line x1="8" y1="17" x2="16" y2="17" />
                </svg>
                Shell 命令连接配置
            </div>
            <div class="config-grid">
                <div class="form-group">
                    <label class="form-label">Signaling 服务器地址</label>
                    <input type="text" class="form-input" id="cmdSignalingUrl" placeholder="ws://example.com:8000">
                </div>
                <div class="form-group">
                    <label class="form-label">远程设备 ID</label>
                    <input type="text" class="form-input" id="cmdRemoteId" placeholder="cmd_XXXXX">
                </div>
            </div>

            <div style="margin-top: 20px;">
                <label class="form-label">ICE 服务器配置</label>
                <div id="cmdIceServers"></div>
                <button class="btn-add" onclick="addCmdIceServer()">+ 添加 ICE 服务器</button>
            </div>
        </div>

        <!-- 主题颜色配置 -->
        <div class="config-section">
            <div class="section-title">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
                </svg>
                主题颜色配置
            </div>
            <div class="config-grid">
                <div class="form-group">
                    <label class="form-label">主色调</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" class="form-color-input" id="themePrimaryColor" value="#FFA500" style="width: 60px; height: 40px; border: none; cursor: pointer;">
                        <input type="text" class="form-input" id="themePrimaryColorText" value="#FFA500" placeholder="#FFA500" style="flex: 1;">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">次色调</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" class="form-color-input" id="themeSecondaryColor" value="#00CED1" style="width: 60px; height: 40px; border: none; cursor: pointer;">
                        <input type="text" class="form-input" id="themeSecondaryColorText" value="#00CED1" placeholder="#00CED1" style="flex: 1;">
                    </div>
                </div>
            </div>
            <div class="config-grid" style="margin-top: 20px;">
                <div class="form-group">
                    <label class="form-label">预设主题</label>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button class="theme-preset-btn" data-color="#FFA500" onclick="applyPresetTheme('#FFA500', '#00CED1')" title="橙色主题">
                            <span class="theme-preview" style="background: linear-gradient(135deg, #FFA500, #00CED1);"></span>
                            橙色
                        </button>
                        <button class="theme-preset-btn" data-color="#FF6B6B" onclick="applyPresetTheme('#FF6B6B', '#4ECDC4')" title="红色主题">
                            <span class="theme-preview" style="background: linear-gradient(135deg, #FF6B6B, #4ECDC4);"></span>
                            红色
                        </button>
                        <button class="theme-preset-btn" data-color="#4ECDC4" onclick="applyPresetTheme('#4ECDC4', '#45B7D1')" title="青色主题">
                            <span class="theme-preview" style="background: linear-gradient(135deg, #4ECDC4, #45B7D1);"></span>
                            青色
                        </button>
                        <button class="theme-preset-btn" data-color="#A855F7" onclick="applyPresetTheme('#A855F7', '#EC4899')" title="紫色主题">
                            <span class="theme-preview" style="background: linear-gradient(135deg, #A855F7, #EC4899);"></span>
                            紫色
                        </button>
                        <button class="theme-preset-btn" data-color="#22C55E" onclick="applyPresetTheme('#22C55E', '#3B82F6')" title="绿色主题">
                            <span class="theme-preview" style="background: linear-gradient(135deg, #22C55E, #3B82F6);"></span>
                            绿色
                        </button>
                        <button class="theme-preset-btn" data-color="#F59E0B" onclick="applyPresetTheme('#F59E0B', '#EF4444')" title="金色主题">
                            <span class="theme-preview" style="background: linear-gradient(135deg, #F59E0B, #EF4444);"></span>
                            金色
                        </button>
                    </div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <button class="btn btn-success" onclick="saveTheme()">保存主题</button>
                <button class="btn btn-secondary" onclick="previewTheme()">预览主题</button>
                <button class="btn btn-secondary" onclick="resetTheme()">重置主题</button>
            </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新建配置模态框 -->
    <div class="modal-overlay" id="createConfigModal">
        <div class="modal">
            <div class="modal-header">新建配置</div>
            <div class="form-group">
                <label class="form-label">配置名称</label>
                <input type="text" class="form-input" id="newConfigName" placeholder="请输入配置名称">
            </div>
            <div class="form-group">
                <label class="form-label">配置描述（可选）</label>
                <input type="text" class="form-input" id="newConfigDesc" placeholder="请输入配置描述">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideCreateConfigModal()">取消</button>
                <button class="btn btn-primary" onclick="createConfig()">确定</button>
            </div>
        </div>
    </div>

    <!-- 重命名配置模态框 -->
    <div class="modal-overlay" id="renameConfigModal">
        <div class="modal">
            <div class="modal-header">重命名配置</div>
            <div class="form-group">
                <label class="form-label">新名称</label>
                <input type="text" class="form-input" id="renameConfigName" placeholder="请输入新名称">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideRenameConfigModal()">取消</button>
                <button class="btn btn-primary" onclick="renameConfig()">确定</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // 渲染配置列表
        function renderConfigList() {
            const configList = document.getElementById('configList');
            const configs = ConfigManager.configs;
            const currentName = ConfigManager.getCurrentConfigName();

            configList.innerHTML = '';

            Object.keys(configs).forEach(name => {
                const config = configs[name];
                const isActive = name === currentName;

                const item = document.createElement('div');
                item.className = `config-item ${isActive ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="config-item-name">${escapeHtml(name)}</div>
                    <div class="config-item-desc">${escapeHtml(config.description || '无描述')}</div>
                    <div class="config-item-actions">
                        <button class="btn-icon-small" onclick="event.stopPropagation(); switchConfig('${escapeHtml(name)}')" title="切换到此配置">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                        <button class="btn-icon-small" onclick="event.stopPropagation(); copyConfig('${escapeHtml(name)}')" title="复制配置">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                `;
                item.addEventListener('click', () => switchConfig(name));
                configList.appendChild(item);
            });
        }

        // 切换配置
        function switchConfig(name) {
            ConfigManager.switchConfig(name);
            loadConfigToForm();
            renderConfigList();
            showMessage(`已切换到配置: ${name}`, 'success');
        }

        // 显示当前配置名称
        function updateCurrentConfigDisplay() {
            const name = ConfigManager.getCurrentConfigName();
            document.getElementById('currentConfigName').textContent = name;
        }

        // 自定义输入显隐
        function configToggleCustomInputs() {
            const fpsSel = document.getElementById('videoFps');
            const brSel = document.getElementById('videoBitrate');
            document.getElementById('videoFpsCustom').style.display = (fpsSel && fpsSel.value == '__custom__') ? 'block' : 'none';
            document.getElementById('videoBitrateCustom').style.display = (brSel && brSel.value == '__custom__') ? 'block' : 'none';
        }
        
        function configGetFps() {
            const sel = document.getElementById('videoFps');
            if (sel && sel.value == '__custom__') {
                const val = parseInt(document.getElementById('videoFpsCustom').value);
                return (val > 0 && val <= 120) ? val : 30;
            }
            return sel ? parseInt(sel.value) : 30;
        }
        
        function configGetBitrate() {
            const sel = document.getElementById('videoBitrate');
            if (sel && sel.value == '__custom__') {
                const val = parseFloat(document.getElementById('videoBitrateCustom').value);
                return (val > 0 && val <= 100) ? Math.round(val * 1000000) : 8000000;
            }
            return sel ? parseInt(sel.value) : 8000000;
        }
        
        document.getElementById('videoFps').addEventListener('change', configToggleCustomInputs);
        document.getElementById('videoBitrate').addEventListener('change', configToggleCustomInputs);
        
        // ==================== 画质挡位 ====================
        const qualityPresets = {
            low:    { fps: 15, bitrate: 1000000, label: '低画质' },
            medium: { fps: 30, bitrate: 4000000, label: '中画质' },
            high:   { fps: 60, bitrate: 8000000, label: '高画质' }
        };
        const presetOrder = ['medium', 'low', 'high'];  // Tab 切换顺序
        
        function applyQualityPreset(presetKey) {
            const preset = qualityPresets[presetKey];
            if (!preset) { console.warn('[QualityPreset] unknown preset:', presetKey); return; }
            console.log('[QualityPreset] applying:', preset.label, preset.fps + 'fps', (preset.bitrate/1000000).toFixed(1)+'Mbps');
            
            // 更新 FPS
            const fpsSel = document.getElementById('videoFps');
            const presetFpsValues = [10, 15, 30, 60];
            if (presetFpsValues.includes(preset.fps)) {
                fpsSel.value = preset.fps.toString();
            } else {
                fpsSel.value = '__custom__';
                document.getElementById('videoFpsCustom').value = preset.fps;
            }
            
            // 更新码率
            const brSel = document.getElementById('videoBitrate');
            const presetBrValues = [1000000, 2000000, 5000000, 8000000];
            if (presetBrValues.includes(preset.bitrate)) {
                brSel.value = preset.bitrate.toString();
            } else {
                brSel.value = '__custom__';
                document.getElementById('videoBitrateCustom').value = (preset.bitrate / 1000000).toFixed(1);
            }
            
            configToggleCustomInputs();
            highlightQualityPreset(presetKey);
            showQualityToast(preset);
        }
        
        function highlightQualityPreset(presetKey) {
            document.querySelectorAll('.quality-preset-btn').forEach(btn => {
                const isActive = btn.dataset.preset === presetKey;
                btn.classList.toggle('active', isActive);
                btn.tabIndex = isActive ? 0 : -1;
            });
        }
        
        function getActivePreset() {
            const activeBtn = document.querySelector('.quality-preset-btn.active');
            return activeBtn ? activeBtn.dataset.preset : null;
        }
        
        // 点击切换 + V 键监听
        document.querySelectorAll('.quality-preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                applyQualityPreset(btn.dataset.preset);
            });
        });
        
        // 全局 V 键循环切换画质挡位
        let qualityToastTimer = null;
        function showQualityToast(preset) {
            const toast = document.getElementById('qualityToast');
            if (!toast) { console.warn('qualityToast element not found'); return; }
            const mbps = (preset.bitrate / 1000000).toFixed(1);
            toast.innerHTML = `<span class="toast-label">${preset.label}</span><span class="toast-info">${preset.fps}fps · ${mbps}Mbps</span>`;
            toast.classList.add('show');
            if (qualityToastTimer) clearTimeout(qualityToastTimer);
            qualityToastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        document.addEventListener('keydown', (e) => {
            // e.code 比 e.key 更可靠，避免大小写/布局差异
            if (e.code !== 'KeyV') return;
            // 不拦截输入框/下拉框中的按键
            const el = document.activeElement;
            if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable)) return;
            e.preventDefault();
            console.log('[QualityPreset] V key pressed, cycling preset');
            const curKey = getActivePreset() || 'medium';
            const curIdx = presetOrder.indexOf(curKey);
            const nextIdx = (curIdx + 1) % presetOrder.length;
            const nextKey = presetOrder[nextIdx];
            console.log('[QualityPreset] switching from', curKey, 'to', nextKey);
            applyQualityPreset(nextKey);
        });
        
        // 根据当前 fps/bitrate 匹配画质挡位
        function matchQualityPreset(fps, bitrate) {
            for (const [key, preset] of Object.entries(qualityPresets)) {
                if (preset.fps === fps && preset.bitrate === bitrate) {
                    return key;
                }
            }
            return null;
        }
        // ==================== 画质挡位 END ====================
        
        // 加载配置到表单
        function loadConfigToForm() {
            const config = ConfigManager.getCurrentConfig();
            updateCurrentConfigDisplay();

            if (!config) return;

            // 视频配置
            document.getElementById('videoSignalingUrl').value = config.video.signalingUrl || '';
            document.getElementById('videoRemoteId').value = config.video.remoteId || '';
            document.getElementById('videoBundlePolicy').value = config.video.bundlePolicy || 'max-bundle';
            document.getElementById('videoRtcpMuxPolicy').value = config.video.rtcpMuxPolicy || 'require';
            document.getElementById('videoEncodedInsertableStreams').value = config.video.encodedInsertableStreams ? 'true' : 'false';

            // 视频参数配置
            const videoConfig = config.video.videoConfig || {};
            const fpsValue = videoConfig.fps || 30;
            const bitrateValue = videoConfig.bitrate || 8000000;
            
            // 设置FPS（预设或自定义）
            const fpsSelectEl = document.getElementById('videoFps');
            const presetFpsValues = [10, 15, 30, 60];
            if (presetFpsValues.includes(fpsValue)) {
                fpsSelectEl.value = fpsValue.toString();
            } else {
                fpsSelectEl.value = '__custom__';
                document.getElementById('videoFpsCustom').value = fpsValue;
            }
            
            // 设置码率（预设或自定义）
            const bitrateSelectEl = document.getElementById('videoBitrate');
            const presetBitrateValues = [1000000, 2000000, 5000000, 8000000];
            if (presetBitrateValues.includes(bitrateValue)) {
                bitrateSelectEl.value = bitrateValue.toString();
            } else {
                bitrateSelectEl.value = '__custom__';
                document.getElementById('videoBitrateCustom').value = (bitrateValue / 1000000).toFixed(1);
            }
            
            configToggleCustomInputs();
            
            // 匹配画质挡位高亮
            const matchedPreset = matchQualityPreset(fpsValue, bitrateValue);
            highlightQualityPreset(matchedPreset || 'medium');

            // 视频 ICE 服务器
            const videoIceContainer = document.getElementById('videoIceServers');
            videoIceContainer.innerHTML = '';
            if (config.video.iceServers && config.video.iceServers.length > 0) {
                config.video.iceServers.forEach((server, index) => {
                    addIceServerElement(videoIceContainer, server, 'video', index);
                });
            }

            // 数据配置
            document.getElementById('dataSignalingUrl').value = config.data.signalingUrl || '';
            document.getElementById('dataRemoteId').value = config.data.remoteId || '';

            // 数据 ICE 服务器
            const dataIceContainer = document.getElementById('dataIceServers');
            dataIceContainer.innerHTML = '';
            if (config.data.iceServers && config.data.iceServers.length > 0) {
                config.data.iceServers.forEach((server, index) => {
                    addIceServerElement(dataIceContainer, server, 'data', index);
                });
            }

            // Shell 命令配置
            if (document.getElementById('cmdSignalingUrl')) {
                document.getElementById('cmdSignalingUrl').value = config.cmd.signalingUrl || '';
                document.getElementById('cmdRemoteId').value = config.cmd.remoteId || '';

                // Shell ICE 服务器
                const cmdIceContainer = document.getElementById('cmdIceServers');
                cmdIceContainer.innerHTML = '';
                if (config.cmd.iceServers && config.cmd.iceServers.length > 0) {
                    config.cmd.iceServers.forEach((server, index) => {
                        addIceServerElement(cmdIceContainer, server, 'cmd', index);
                    });
                }
            }

            // 主题配置
            const theme = config.theme || {};
            document.getElementById('themePrimaryColor').value = theme.primaryColor || '#FFA500';
            document.getElementById('themePrimaryColorText').value = theme.primaryColor || '#FFA500';
            document.getElementById('themeSecondaryColor').value = theme.secondaryColor || '#00CED1';
            document.getElementById('themeSecondaryColorText').value = theme.secondaryColor || '#00CED1';
        }

        // 应用预设主题
        function applyPresetTheme(primaryColor, secondaryColor) {
            document.getElementById('themePrimaryColor').value = primaryColor;
            document.getElementById('themePrimaryColorText').value = primaryColor;
            document.getElementById('themeSecondaryColor').value = secondaryColor;
            document.getElementById('themeSecondaryColorText').value = secondaryColor;
            previewTheme();
        }

        // 预览主题
        function previewTheme() {
            const primaryColor = document.getElementById('themePrimaryColor').value;
            const secondaryColor = document.getElementById('themeSecondaryColor').value;
            
            const themeColors = ConfigManager.generateThemeColors(primaryColor);
            themeColors.secondaryColor = secondaryColor;
            
            const rgb = ConfigManager.hexToRgb(secondaryColor);
            const hsl = ConfigManager.rgbToHsl(rgb.r, rgb.g, rgb.b);
            const dimHsl = { h: hsl.h, s: hsl.s, l: Math.max(hsl.l - 0.15, 0) };
            const dimRgb = ConfigManager.hslToRgb(dimHsl.h, dimHsl.s, dimHsl.l);
            themeColors.secondaryDim = ConfigManager.rgbToHex(dimRgb.r, dimRgb.g, dimRgb.b);
            
            const root = document.documentElement;
            root.style.setProperty('--titan-primary', themeColors.primaryColor);
            root.style.setProperty('--titan-primary-bright', themeColors.primaryBright);
            root.style.setProperty('--titan-primary-dim', themeColors.primaryDim);
            root.style.setProperty('--titan-secondary', themeColors.secondaryColor);
            root.style.setProperty('--titan-secondary-dim', themeColors.secondaryDim);
            
            const primaryRgb = ConfigManager.hexToRgb(themeColors.primaryColor);
            root.style.setProperty('--titan-glow', `0 0 10px rgba(${primaryRgb.r}, ${primaryRgb.g}, ${primaryRgb.b}, 0.5)`);
            root.style.setProperty('--titan-glow-strong', `0 0 20px rgba(${primaryRgb.r}, ${primaryRgb.g}, ${primaryRgb.b}, 0.8)`);
            
            showMessage('主题预览已应用', 'success');
        }

        // 保存主题
        function saveTheme() {
            const primaryColor = document.getElementById('themePrimaryColor').value;
            const secondaryColor = document.getElementById('themeSecondaryColor').value;
            
            const themeColors = ConfigManager.generateThemeColors(primaryColor);
            themeColors.secondaryColor = secondaryColor;
            
            const rgb = ConfigManager.hexToRgb(secondaryColor);
            const hsl = ConfigManager.rgbToHsl(rgb.r, rgb.g, rgb.b);
            const dimHsl = { h: hsl.h, s: hsl.s, l: Math.max(hsl.l - 0.15, 0) };
            const dimRgb = ConfigManager.hslToRgb(dimHsl.h, dimHsl.s, dimHsl.l);
            themeColors.secondaryDim = ConfigManager.rgbToHex(dimRgb.r, dimRgb.g, dimRgb.b);
            
            ConfigManager.updateTheme(themeColors);
            showMessage('主题已保存', 'success');
            
            localStorage.setItem('webrtc_theme_updated', Date.now().toString());
        }

        // 重置主题
        function resetTheme() {
            const defaultTheme = ConfigManager.defaultConfigTemplate.theme;
            document.getElementById('themePrimaryColor').value = defaultTheme.primaryColor;
            document.getElementById('themePrimaryColorText').value = defaultTheme.primaryColor;
            document.getElementById('themeSecondaryColor').value = defaultTheme.secondaryColor;
            document.getElementById('themeSecondaryColorText').value = defaultTheme.secondaryColor;
            
            ConfigManager.updateTheme(defaultTheme);
            showMessage('主题已重置', 'success');
        }

        // 颜色输入同步
        document.getElementById('themePrimaryColor').addEventListener('input', function() {
            document.getElementById('themePrimaryColorText').value = this.value;
        });
        document.getElementById('themePrimaryColorText').addEventListener('input', function() {
            if (/^#[0-9A-Fa-f]{6}$/.test(this.value)) {
                document.getElementById('themePrimaryColor').value = this.value;
            }
        });
        document.getElementById('themeSecondaryColor').addEventListener('input', function() {
            document.getElementById('themeSecondaryColorText').value = this.value;
        });
        document.getElementById('themeSecondaryColorText').addEventListener('input', function() {
            if (/^#[0-9A-Fa-f]{6}$/.test(this.value)) {
                document.getElementById('themeSecondaryColor').value = this.value;
            }
        });

        // 显示新建配置模态框
        function showCreateConfigModal() {
            console.log('showCreateConfigModal called');
            document.getElementById('newConfigName').value = '';
            document.getElementById('newConfigDesc').value = '';
            const modal = document.getElementById('createConfigModal');
            console.log('modal element:', modal);
            modal.classList.add('active');
            console.log('modal classes after adding active:', modal.className);
        }

        // 隐藏新建配置模态框
        function hideCreateConfigModal() {
            document.getElementById('createConfigModal').classList.remove('active');
        }

        // 创建配置
        function createConfig() {
            const name = document.getElementById('newConfigName').value.trim();
            const desc = document.getElementById('newConfigDesc').value.trim();

            if (!name) {
                showMessage('请输入配置名称', 'error');
                return;
            }

            try {
                ConfigManager.createConfig(name, desc);
                hideCreateConfigModal();
                renderConfigList();
                switchConfig(name);
                showMessage('配置创建成功', 'success');
            } catch (e) {
                showMessage(e.message, 'error');
            }
        }

        // 显示重命名配置模态框
        function showRenameConfigModal() {
            const currentName = ConfigManager.getCurrentConfigName();
            document.getElementById('renameConfigName').value = currentName;
            document.getElementById('renameConfigModal').classList.add('active');
        }

        // 隐藏重命名配置模态框
        function hideRenameConfigModal() {
            document.getElementById('renameConfigModal').classList.remove('active');
        }

        // 重命名配置
        function renameConfig() {
            const newName = document.getElementById('renameConfigName').value.trim();
            const oldName = ConfigManager.getCurrentConfigName();

            if (!newName) {
                showMessage('请输入新名称', 'error');
                return;
            }

            try {
                ConfigManager.renameConfig(oldName, newName);
                hideRenameConfigModal();
                renderConfigList();
                updateCurrentConfigDisplay();
                showMessage('配置重命名成功', 'success');
            } catch (e) {
                showMessage(e.message, 'error');
            }
        }

        // 复制当前配置
        function copyCurrentConfig() {
            const currentName = ConfigManager.getCurrentConfigName();
            const newName = `${currentName}_copy`;

            try {
                ConfigManager.copyConfig(currentName, newName);
                renderConfigList();
                switchConfig(newName);
                showMessage('配置复制成功', 'success');
            } catch (e) {
                showMessage(e.message, 'error');
            }
        }

        // 复制指定配置
        function copyConfig(name) {
            const newName = `${name}_copy`;

            try {
                ConfigManager.copyConfig(name, newName);
                renderConfigList();
                switchConfig(newName);
                showMessage('配置复制成功', 'success');
            } catch (e) {
                showMessage(e.message, 'error');
            }
        }

        // 删除当前配置
        function deleteCurrentConfig() {
            const name = ConfigManager.getCurrentConfigName();

            if (Object.keys(ConfigManager.configs).length === 1) {
                showMessage('不能删除最后一个配置', 'error');
                return;
            }

            if (confirm(`确定要删除配置 "${name}" 吗？`)) {
                try {
                    ConfigManager.deleteConfig(name);
                    renderConfigList();
                    loadConfigToForm();
                    showMessage('配置删除成功', 'success');
                } catch (e) {
                    showMessage(e.message, 'error');
                }
            }
        }

        // HTML 转义
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 添加 ICE 服务器元素
        function addIceServerElement(container, server, type, index) {
            const div = document.createElement('div');
            div.className = 'ice-server-item';
            div.dataset.index = index;
            div.dataset.type = type;

            const urls = server.urls || [];
            const urlValue = Array.isArray(urls) ? urls.join(', ') : urls;

            div.innerHTML = `
                <div class="ice-server-header">
                    <span class="ice-server-title">ICE 服务器 #${index + 1}</span>
                    <button class="btn-icon" onclick="removeIceServer('${type}', ${index})">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
                            <line x1="18" x2="6" y1="6" y2="18"></line>
                            <line x1="6" x2="18" y1="6" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="form-group">
                    <label class="form-label">URLs (多个用逗号分隔)</label>
                    <input type="text" class="form-input" value="${urlValue}" placeholder="stun:stun.example.com:19302, turn:turn.example.com:3478?transport=udp">
                </div>
                <div class="form-group">
                    <label class="form-label">用户名 (TURN)</label>
                    <input type="text" class="form-input" value="${server.username || ''}" placeholder="username">
                </div>
                <div class="form-group">
                    <label class="form-label">密码 (TURN)</label>
                    <input type="password" class="form-input" value="${server.credential || ''}" placeholder="credential">
                </div>
            `;
            container.appendChild(div);
        }

        // 添加视频 ICE 服务器
        function addVideoIceServer() {
            const container = document.getElementById('videoIceServers');
            const index = container.children.length;
            addIceServerElement(container, { urls: [] }, 'video', index);
        }

        // 添加数据 ICE 服务器
        function addDataIceServer() {
            const container = document.getElementById('dataIceServers');
            const index = container.children.length;
            addIceServerElement(container, { urls: [] }, 'data', index);
        }

        // 添加 Shell 命令 ICE 服务器
        function addCmdIceServer() {
            const container = document.getElementById('cmdIceServers');
            const index = container.children.length;
            addIceServerElement(container, { urls: [] }, 'cmd', index);
        }

        // 删除 ICE 服务器
        function removeIceServer(type, index) {
            const container = document.getElementById(`${type}IceServers`);
            const item = container.querySelector(`[data-index="${index}"]`);
            if (item) {
                item.remove();
                // 更新索引
                const items = container.querySelectorAll('.ice-server-item');
                items.forEach((item, i) => {
                    item.dataset.index = i;
                    const title = item.querySelector('.ice-server-title');
                    if (title) title.textContent = `ICE 服务器 #${i + 1}`;
                });
            }
        }

        // 从表单获取 ICE 服务器配置
        function getIceServersFromForm(type) {
            const container = document.getElementById(`${type}IceServers`);
            const items = container.querySelectorAll('.ice-server-item');
            const iceServers = [];

            items.forEach(item => {
                const urlsInput = item.querySelector('.form-input');
                const usernameInput = item.querySelectorAll('.form-input')[1];
                const credentialInput = item.querySelectorAll('.form-input')[2];

                const urlsValue = urlsInput.value.trim();
                if (urlsValue) {
                    const urls = urlsValue.split(',').map(url => url.trim()).filter(url => url);
                    const server = { urls };
                    if (usernameInput.value.trim()) server.username = usernameInput.value.trim();
                    if (credentialInput.value.trim()) server.credential = credentialInput.value.trim();
                    iceServers.push(server);
                }
            });

            return iceServers;
        }

        // 保存并应用配置
        function saveAndApply() {
            try {
                const currentName = ConfigManager.getCurrentConfigName();

                // 收集视频配置
                const videoConfig = {
                    signalingUrl: document.getElementById('videoSignalingUrl').value.trim(),
                    remoteId: document.getElementById('videoRemoteId').value.trim(),
                    iceServers: getIceServersFromForm('video'),
                    bundlePolicy: document.getElementById('videoBundlePolicy').value,
                    rtcpMuxPolicy: document.getElementById('videoRtcpMuxPolicy').value,
                    encodedInsertableStreams: document.getElementById('videoEncodedInsertableStreams').value === 'true',
                    videoConfig: {
                        fps: configGetFps(),
                        bitrate: configGetBitrate()
                    }
                };

                // 收集数据配置
                const dataConfig = {
                    signalingUrl: document.getElementById('dataSignalingUrl').value.trim(),
                    remoteId: document.getElementById('dataRemoteId').value.trim(),
                    iceServers: getIceServersFromForm('data')
                };

                // 收集 Shell 命令配置
                const cmdConfig = {
                    signalingUrl: document.getElementById('cmdSignalingUrl').value.trim(),
                    remoteId: document.getElementById('cmdRemoteId').value.trim(),
                    iceServers: getIceServersFromForm('cmd')
                };

                // 收集主题配置
                const primaryColor = document.getElementById('themePrimaryColor').value;
                const secondaryColor = document.getElementById('themeSecondaryColor').value;
                const themeColors = ConfigManager.generateThemeColors(primaryColor);
                themeColors.secondaryColor = secondaryColor;
                
                const rgb = ConfigManager.hexToRgb(secondaryColor);
                const hsl = ConfigManager.rgbToHsl(rgb.r, rgb.g, rgb.b);
                const dimHsl = { h: hsl.h, s: hsl.s, l: Math.max(hsl.l - 0.15, 0) };
                const dimRgb = ConfigManager.hslToRgb(dimHsl.h, dimHsl.s, dimHsl.l);
                themeColors.secondaryDim = ConfigManager.rgbToHex(dimRgb.r, dimRgb.g, dimRgb.b);

                // 更新配置
                ConfigManager.updateVideoConfig(videoConfig);
                ConfigManager.updateDataConfig(dataConfig);
                ConfigManager.updateCmdConfig(cmdConfig);
                ConfigManager.updateTheme(themeColors);

                showMessage('配置已保存', 'success');

                // 通知主页面配置已更新
                localStorage.setItem('webrtc_config_updated', Date.now().toString());
                localStorage.setItem('webrtc_theme_updated', Date.now().toString());

                setTimeout(() => {
                    window.close();
                }, 800);
            } catch (e) {
                console.error('保存配置失败:', e);
                showMessage('保存配置失败: ' + e.message, 'error');
            }
        }

        // 仅应用配置（不保存）
        function applyOnly() {
            try {
                const videoConfig = {
                    signalingUrl: document.getElementById('videoSignalingUrl').value.trim(),
                    remoteId: document.getElementById('videoRemoteId').value.trim(),
                    iceServers: getIceServersFromForm('video'),
                    bundlePolicy: document.getElementById('videoBundlePolicy').value,
                    rtcpMuxPolicy: document.getElementById('videoRtcpMuxPolicy').value,
                    encodedInsertableStreams: document.getElementById('videoEncodedInsertableStreams').value === 'true',
                    videoConfig: {
                        fps: parseInt(document.getElementById('videoFps').value),
                        bitrate: parseInt(document.getElementById('videoBitrate').value)
                    }
                };

                const dataConfig = {
                    signalingUrl: document.getElementById('dataSignalingUrl').value.trim(),
                    remoteId: document.getElementById('dataRemoteId').value.trim(),
                    iceServers: getIceServersFromForm('data')
                };

                const cmdConfig = {
                    signalingUrl: document.getElementById('cmdSignalingUrl').value.trim(),
                    remoteId: document.getElementById('cmdRemoteId').value.trim(),
                    iceServers: getIceServersFromForm('cmd')
                };

                ConfigManager.updateVideoConfig(videoConfig);
                ConfigManager.updateDataConfig(dataConfig);
                ConfigManager.updateCmdConfig(cmdConfig);

                showMessage('配置已应用', 'success');

                // 通知主页面配置已更新
                localStorage.setItem('webrtc_config_updated', Date.now().toString());

                setTimeout(() => {
                    window.close();
                }, 500);
            } catch (e) {
                console.error('应用配置失败:', e);
                showMessage('应用配置失败: ' + e.message, 'error');
            }
        }

        // 显示消息
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }

        // 页面加载时加载配置
        window.addEventListener('load', function() {
            ConfigManager.init();
            renderConfigList();
            loadConfigToForm();
        });
    </script>
</body>
</html>
